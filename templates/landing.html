{{ define "landing.html" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luky &amp; Lelaina · Wedding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "DM Sans", sans-serif; }
    .font-display { font-family: "Playfair Display", serif; }
  </style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800">
  <section
    class="min-h-screen flex items-center justify-center
           bg-gradient-to-br from-rose-50 via-stone-50 to-amber-50
           px-6 py-16"
  >
    <div class="w-full max-w-2xl text-center">
      <p class="mb-5 text-sm font-semibold uppercase tracking-[0.3em] text-rose-700">
        We're getting married
      </p>

      <h1 class="font-display text-6xl md:text-8xl text-stone-900">
        Luky &amp; Lelaina
      </h1>

      <p class="mx-auto mt-6 max-w-xl text-lg leading-relaxed text-stone-600">
        We'd love to celebrate this special day with you.
        Enter the unique code from your invitation to RSVP.
      </p>

      {{ if .Error }}
      <div class="mx-auto mt-8 max-w-md rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-left text-sm text-red-700">
        {{ .Error }}
      </div>
      {{ end }}

      <form action="/" method="GET" class="mx-auto mt-8 max-w-md rounded-3xl border border-white bg-white/90 p-6 text-left shadow-xl backdrop-blur">
        <label for="code" class="mb-2 block text-sm font-semibold">Invitation code</label>
        <input id="code" name="code" type="text" required autocomplete="off" placeholder="ALICE-BOB-7K2P" class="w-full rounded-xl border border-stone-300 px-4 py-3 uppercase outline-none transition focus:border-rose-400 focus:ring-2 focus:ring-rose-200">
        <button type="submit" class="mt-4 w-full rounded-xl bg-stone-900 px-5 py-3.5 font-semibold text-white transition hover:bg-stone-700">
          Open my invitation
        </button>
      </form>

      <p class="mt-6 text-sm text-stone-500">
        Your code can be found on your invitation.
      </p>
    </div>
  </section>
</body>
</html>
{{ end }}
