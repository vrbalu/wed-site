{{ define "landing.html" }}
<!doctype html>
<html lang="{{ .Language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Text.LandingTitle }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "DM Sans", sans-serif; }
    .font-display { font-family: "Playfair Display", serif; }
    html { scroll-behavior: smooth; }
    @keyframes logo-fly-in {
      from { opacity: 0; transform: translateY(-55vh) rotate(-8deg) scale(.82); }
      to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }
    @keyframes section-fly-in {
      from { opacity: 0; transform: translate3d(0, 3.5rem, 0) scale(.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    .logo-fly-in { animation: logo-fly-in 1.2s cubic-bezier(.2,.75,.25,1) both; }
    .logo-video { mix-blend-mode: multiply; }
    .logo-stage {
      width: calc(100% + 2rem);
      margin-inline: -1rem;
    }
    @media (min-width: 768px) {
      .logo-stage { width: 100%; margin-inline: 0; }
    }
    @media (max-width: 767px) {
      .logo-stage {
        aspect-ratio: 3 / 4;
        max-height: 72svh;
      }
      .logo-stage > video,
      .logo-stage > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      .has-scroll-reveal [data-reveal] {
        opacity: 0;
        transform: translate3d(0, 3.5rem, 0) scale(.985);
      }
      .has-scroll-reveal [data-reveal].is-visible {
        animation: section-fly-in 900ms cubic-bezier(.2,.75,.25,1) 300ms both;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .logo-fly-in { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800">
  <section
    aria-label="Luky and Lelaina wedding"
    class="relative flex min-h-[100svh] items-center justify-center
           bg-gradient-to-br from-[#d7eee4] via-[#f3f8f5] to-[#eef4e9]
           px-6 py-20"
  >
    <div class="logo-stage max-w-5xl shrink-0 text-center">
      <video
        id="logo-animation"
        width="1440"
        height="1440"
        muted
        playsinline
        preload="metadata"
        poster="/assets/logo-transparent.png"
        aria-label="{{ .Text.LogoAlt }}"
        class="logo-fly-in logo-video mx-auto h-auto max-h-[72svh] w-full max-w-5xl object-contain motion-reduce:hidden"
      >
        <source src="/assets/ll_logo.mp4" type="video/mp4">
      </video>
      <img
        src="/assets/logo-transparent.png"
        alt="{{ .Text.LogoAlt }}"
        width="959"
        height="676"
        class="mx-auto hidden h-auto max-h-[72svh] w-full max-w-5xl object-contain motion-reduce:block"
      >
    </div>
    <a href="#rsvp" class="absolute bottom-8 left-1/2 inline-flex -translate-x-1/2 flex-col items-center gap-2 text-sm font-semibold text-stone-600 transition-colors hover:text-[#356f60]">
      <span>{{ .Text.Welcome }}</span>
      <span aria-hidden="true" class="text-2xl leading-none">&#8595;</span>
    </a>
  </section>

  <section id="rsvp" aria-labelledby="rsvp-title" class="flex min-h-[90svh] scroll-mt-6 items-center justify-center border-y border-stone-200 bg-white px-5 py-16">
    <div data-reveal class="w-full max-w-xl text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#356f60]">{{ .Text.GettingMarried }}</p>
      <h1 id="rsvp-title" class="font-display mt-3 text-5xl text-stone-900 md:text-6xl">Luky &amp; Lelaina</h1>
      <p class="mx-auto mt-5 max-w-lg text-lg leading-relaxed text-stone-600">
        {{ .Text.LandingIntro }}
      </p>

      {{ if .Error }}
      <div class="mx-auto mt-8 max-w-md rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-left text-sm text-red-700">
        {{ .Error }}
      </div>
      {{ end }}

      <form action="/" method="GET" class="mx-auto mt-8 max-w-md rounded-3xl border border-stone-100 bg-stone-50 p-6 text-left shadow-lg">
        <label for="code" class="mb-2 block text-sm font-semibold">{{ .Text.InvitationCode }}</label>
        <input id="code" name="code" type="text" required autocomplete="off" placeholder="ALICE-BOB-7K2P" class="w-full rounded-xl border border-stone-300 px-4 py-3 uppercase outline-none transition focus:border-[#5f9d83] focus:ring-2 focus:ring-[#c6e5d8]">
        <button type="submit" class="mt-4 w-full rounded-xl bg-stone-900 px-5 py-3.5 font-semibold text-white transition hover:bg-stone-700">
          {{ .Text.OpenInvitation }}
        </button>
      </form>

      <p class="mt-6 text-sm text-stone-500">{{ .Text.CodeHint }}</p>
      <a class="mt-7 inline-flex font-semibold text-[#356f60] underline decoration-[#94cbb8] underline-offset-4 transition-colors hover:text-[#23483f]" href="#weekend">{{ .Text.ExploreDetails }}</a>
    </div>
  </section>
  {{ template "guest-info" . }}
  <script>
    const logoVideo = document.querySelector("#logo-animation");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (logoVideo) {
      const syncLogoPlayback = () => {
        if (reducedMotion.matches) {
          logoVideo.pause();
        } else {
          logoVideo.play().catch(() => {});
        }
      };
      syncLogoPlayback();
      reducedMotion.addEventListener("change", syncLogoPlayback);
    }

    if ("IntersectionObserver" in window) {
      document.documentElement.classList.add("has-scroll-reveal");
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll("[data-reveal]").forEach((element) => revealObserver.observe(element));
    }
  </script>
</body>
</html>
{{ end }}
